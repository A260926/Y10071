openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders/{orderId}:
    get:
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Base:
      type: object
      required: [id]
      properties:
        id: { type: string }
    Audited:
      type: object
      required: [createdAt]
      properties:
        createdAt: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/Audited'
        - type: object
          required: [amount]
          properties:
            amount: { type: number }
